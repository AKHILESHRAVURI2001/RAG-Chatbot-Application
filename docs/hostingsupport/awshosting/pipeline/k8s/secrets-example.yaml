# Copy this to secrets.yaml (git-ignored — never commit real secret values)
# and fill in real values, OR better: manage this secret directly in AWS
# Secrets Manager and sync it into the cluster with the "External Secrets
# Operator" instead of hand-editing a file with plaintext values in it —
# see the note at the bottom of eks.md.
#
# `stringData` (as opposed to `data`) lets you write plain text here —
# Kubernetes base64-encodes it for you when the object is created.
apiVersion: v1
kind: Secret
metadata:
  name: mcb-app-secret
  namespace: minichatbot
type: Opaque
stringData:
  DATABASE_URL: "postgresql://mcbadmin:YOUR_DB_PASSWORD@YOUR_RDS_ENDPOINT:5432/minichatbot"
  ADMIN_JWT_SECRET: "a-long-random-string-you-make-up"
  GEMINI_API_KEY: "your-real-gemini-key-or-leave-blank"
  SARVAM_API_KEY: ""
